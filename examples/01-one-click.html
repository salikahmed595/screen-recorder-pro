<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Screen Recorder — One Click</title>
<link rel="icon" href="data:,"/>
<style>
/* PAICONS theme — near-black with a green tint, lime accent */
:root{--bg:#0b0d0a;--surface:#12150f;--surface2:#1a2014;--line:#2a3222;--accent:#b9f464;--ink:#0b0d0a;--text:#f2f5ee;--sub:#8e9a85;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);
  background:radial-gradient(900px 480px at 80% -120px,rgba(185,244,100,.10),transparent 70%),radial-gradient(700px 400px at 0% 100%,rgba(185,244,100,.05),transparent 70%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
kbd{background:var(--surface2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font:600 12px ui-monospace,Consolas,monospace;color:var(--text)}
em{font-style:normal;color:var(--accent)}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px}
.logo i{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .12s,filter .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#47563a}
.btn:disabled{opacity:.35;cursor:default}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,7,4,.82);backdrop-filter:blur(6px);z-index:50;gap:10px}
#cd.show{display:flex}
#cd span{font-size:clamp(110px,26vw,220px);font-weight:900;color:var(--accent);text-shadow:0 0 60px rgba(185,244,100,.45);animation:pop 1s ease-out infinite}
#cd small{color:var(--sub);font-size:14px}
@keyframes pop{0%{transform:scale(1.35);opacity:0}25%{opacity:1}100%{transform:scale(.9);opacity:.85}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;pointer-events:none;background:var(--surface2);border:1px solid var(--line);padding:11px 16px;border-radius:12px;font-size:14px;transition:.25s;z-index:60;max-width:92vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
video{background:#000}

.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 20px 40px}
header{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center}
.pill{font-size:12px;color:var(--sub);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;max-width:720px}
h1{font-size:clamp(34px,6.4vw,60px);line-height:1.04;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:16px;max-width:460px;line-height:1.6}
.rec-wrap{position:relative;margin:26px 0 6px;width:190px;height:190px;display:grid;place-items:center}
.rec-wrap::before,.rec-wrap::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}
.recording .rec-wrap::before{animation:ring 1.8s ease-out infinite}
.recording .rec-wrap::after{animation:ring 1.8s ease-out .9s infinite}
@keyframes ring{0%{transform:scale(.82);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.rec{width:150px;height:150px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;
  box-shadow:0 0 0 8px rgba(185,244,100,.12),0 20px 60px rgba(185,244,100,.28);transition:transform .15s,box-shadow .2s}
.rec:hover{transform:scale(1.045)}
.rec:active{transform:scale(.96)}
.rec .ico{width:46px;height:46px;border-radius:50%;background:var(--ink);transition:.2s}
.recording .rec .ico{border-radius:9px;width:40px;height:40px;background:var(--red)}
.timer{font:600 22px ui-monospace,Consolas,monospace;color:var(--sub);min-height:32px;font-variant-numeric:tabular-nums}
.recording .timer{color:var(--text)}
.recording .timer::before{content:'● ';color:var(--red);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--sub);transition:.15s}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(185,244,100,.08)}
.chip:disabled{opacity:.4;cursor:default}
.hint{color:var(--sub);font-size:13px;line-height:1.7}
#done{width:100%;display:grid;gap:16px;text-align:left}
#done h2{font-size:28px;font-weight:600}
#done video{width:100%;border-radius:16px;border:1px solid var(--line);max-height:56vh}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row .meta{color:var(--sub);font-size:14px;margin-right:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header><span class="logo"><i></i> Screen Recorder</span><span class="pill">100% private · nothing is uploaded</span></header>

  <main id="home">
    <h1>Record your screen<br><em>in one click.</em></h1>
    <p class="sub">Press the button, pick what to share, and you're recording. Press it again to finish.</p>
    <div class="rec-wrap"><button class="rec" id="rec" aria-label="Start recording"><span class="ico"></span></button></div>
    <div class="timer" id="timer">Ready when you are</div>
    <div class="chips">
      <button class="chip on" data-k="mic" aria-pressed="true">🎙 Microphone</button>
      <button class="chip" data-k="cam" aria-pressed="false">📷 Face bubble</button>
      <button class="chip" data-k="sys" aria-pressed="false">🔊 Tab audio</button>
    </div>
    <p class="hint">Pick <b>Chrome Tab</b> in the share window · stop any time with <kbd>Space</kbd></p>
  </main>

  <main id="done" hidden>
    <h2>Nice — <em>that's a wrap.</em></h2>
    <video id="player" controls></video>
    <div class="row">
      <span class="meta" id="meta"></span>
      <button class="btn ghost" id="again">↺ Record again</button>
      <a class="btn primary" id="dl" href="#" download>⬇ Download</a>
    </div>
  </main>
</div>
<div id="cd"></div>
<div class="toast" id="toast"></div>

<script>
/* ───────────── Recording core (shared by all three examples) ─────────────
   getDisplayMedia + getUserMedia → (optional canvas compositor) → AudioContext mixer → MediaRecorder.
   No libraries, nothing is uploaded. */
const core = (() => {
  let screen = null, cam = null, mic = null, actx = null, gain = null, analyser = null;
  let rec = null, chunks = [], stream = null, canvas = null, c2 = null, sv = null, cv = null;
  let handles = [], lastT = 0, fps = 30, t0 = 0, pausedMs = 0, pauseAt = 0, micOn = true;
  const api = { cam: { pos: 'br', size: 0.22, shape: 'round', mirror: true, x: null, y: null }, layers: [], onEnded: null };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const ready = v => new Promise(r => { const t = () => (v.videoWidth > 0 ? r(v) : setTimeout(t, 40)); t(); });
  async function vid(s) { const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.srcObject = s; await v.play(); return ready(v); }

  function camBox() {
    const w = Math.round(canvas.width * api.cam.size), h = Math.round(w * cv.videoHeight / cv.videoWidth), pad = 18;
    let x, y;
    if (api.cam.x != null) { x = api.cam.x; y = api.cam.y; }
    else { const p = api.cam.pos; x = p.includes('r') ? canvas.width - w - pad : pad; y = p.includes('b') ? canvas.height - h - pad : pad; }
    return { x: Math.max(0, Math.min(canvas.width - w, x)), y: Math.max(0, Math.min(canvas.height - h, y)), w, h };
  }
  function camPath(b) {
    c2.beginPath();
    if (api.cam.shape === 'round') c2.arc(b.x + b.w / 2, b.y + b.h / 2, Math.min(b.w, b.h) / 2, 0, Math.PI * 2);
    else c2.roundRect(b.x, b.y, b.w, b.h, 16);
  }
  function frame(force) {
    if (!sv) return;
    const now = performance.now();
    if (!force && now - lastT < (1000 / fps) * 0.8) return;   // screen + camera both call this
    lastT = now;
    c2.drawImage(sv, 0, 0, canvas.width, canvas.height);
    api.layers.forEach(fn => fn(c2, canvas.width, canvas.height));
    if (cv) {
      const b = camBox();
      c2.save(); camPath(b); c2.clip();
      if (api.cam.mirror) { c2.translate(b.x + b.w, b.y); c2.scale(-1, 1); c2.drawImage(cv, 0, 0, b.w, b.h); }
      else c2.drawImage(cv, b.x, b.y, b.w, b.h);
      c2.restore();
      c2.lineWidth = 4; c2.strokeStyle = '#b9f464'; camPath(b); c2.stroke();
    }
  }
  // requestVideoFrameCallback keeps compositing even when this tab is in the background
  function hook(v) { const h = { v, id: 0 }; const cb = () => { frame(); h.id = v.requestVideoFrameCallback(cb); }; h.id = v.requestVideoFrameCallback(cb); handles.push(h); }

  api.open = async function ({ mode = 'screen', mic: wantMic = true, sysAudio = false, fps: f = 30, canvas: wantCanvas = false } = {}) {
    fps = f; micOn = wantMic;
    try {
      if (mode !== 'camera') screen = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: fps } }, audio: sysAudio });
      if (mode !== 'screen') cam = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: wantMic });
      else if (wantMic) { try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (_) { api.micFailed = true; } }
      const micSrc = mic || (cam && cam.getAudioTracks().length ? cam : null);
      const sysSrc = screen && screen.getAudioTracks().length ? screen : null;
      let audioTrack = null;
      if (micSrc || sysSrc) {
        actx = new AudioContext(); actx.resume && actx.resume();
        const dest = actx.createMediaStreamDestination(), bus = actx.createGain();
        analyser = actx.createAnalyser(); analyser.fftSize = 512;
        bus.connect(dest); bus.connect(analyser);
        if (micSrc) { gain = actx.createGain(); gain.gain.value = micOn ? 1 : 0; actx.createMediaStreamSource(new MediaStream(micSrc.getAudioTracks())).connect(gain); gain.connect(bus); }
        if (sysSrc) actx.createMediaStreamSource(new MediaStream(sysSrc.getAudioTracks())).connect(bus);
        audioTrack = dest.stream.getAudioTracks()[0];
      }
      let videoTrack, preview;
      if (mode === 'camera') { videoTrack = cam.getVideoTracks()[0]; preview = { stream: cam }; }
      else if (mode === 'both' || wantCanvas) {
        sv = await vid(screen); cv = cam ? await vid(cam) : null;
        canvas = document.createElement('canvas'); canvas.width = sv.videoWidth; canvas.height = sv.videoHeight; c2 = canvas.getContext('2d');
        frame(true); hook(sv); if (cv) hook(cv);
        await sleep(250);                                     // let a real frame land before captureStream
        videoTrack = canvas.captureStream(fps).getVideoTracks()[0]; preview = { canvas };
      } else { videoTrack = screen.getVideoTracks()[0]; preview = { stream: screen }; }
      stream = new MediaStream([videoTrack, audioTrack].filter(Boolean));
      [screen, cam].forEach(s => { const t = s && s.getVideoTracks()[0]; if (t) t.addEventListener('ended', () => api.onEnded && api.onEnded()); });
      return preview;
    } catch (e) { api.close(); throw e; }
  };
  api.record = function ({ bitrate = 5e6 } = {}) {
    chunks = [];
    const mime = ['video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: bitrate, audioBitsPerSecond: 128000 });
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.start(1000); t0 = performance.now(); pausedMs = 0; pauseAt = 0;
  };
  api.elapsed = () => (t0 ? ((pauseAt || performance.now()) - t0 - pausedMs) / 1000 : 0);
  api.pause = () => { if (rec && rec.state === 'recording') { rec.pause(); pauseAt = performance.now(); } };
  api.resume = () => { if (rec && rec.state === 'paused') { rec.resume(); pausedMs += performance.now() - pauseAt; pauseAt = 0; } };
  api.paused = () => !!(rec && rec.state === 'paused');
  api.recording = () => !!rec && rec.state !== 'inactive';
  api.stop = () => new Promise(resolve => {
    if (!rec || rec.state === 'inactive') { resolve({ blob: new Blob([]), seconds: 0 }); return; }
    const seconds = api.elapsed();
    rec.onstop = () => { const blob = new Blob(chunks, { type: 'video/webm' }); api.close(); resolve({ blob, seconds }); };
    rec.stop();
  });
  api.setMic = on => { micOn = on; if (gain) gain.gain.value = on ? 1 : 0; return !!gain; };
  api.level = () => {                                          // 0..1 for a VU meter
    if (!analyser) return 0;
    const b = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(b);
    let s = 0; for (const v of b) s += v * v;
    const db = 20 * Math.log10(Math.sqrt(s / b.length) || 1e-5);
    return Math.max(0, Math.min(1, (db + 60) / 60));
  };
  api.canvas = () => canvas;
  api.camBox = () => (cv ? camBox() : null);
  api.redraw = () => frame(true);
  api.close = () => {
    handles.forEach(h => { try { h.v.cancelVideoFrameCallback(h.id); } catch (_) {} }); handles = [];
    [screen, cam, mic].forEach(s => s && s.getTracks().forEach(t => t.stop()));
    if (actx) actx.close().catch(() => {});
    screen = cam = mic = actx = gain = analyser = rec = stream = canvas = c2 = sv = cv = null; t0 = 0;
  };
  return api;
})();

/* ───────────── Small helpers ───────────── */
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const stamp = () => new Date().toISOString().slice(0, 19).replace('T', ' ').replace(/:/g, '-');
const mb = b => (b / 1048576).toFixed(1) + ' MB';
function nice(e) {
  return ({ NotAllowedError: 'Cancelled, or permission was denied.', AbortError: 'Cancelled.', NotFoundError: 'No camera or microphone found.', NotReadableError: 'Your camera or mic is busy in another app.' })[e && e.name] || ('Something went wrong: ' + (e && e.message));
}
function countdown(n, el) {
  return new Promise((res, rej) => {
    el.classList.add('show'); let cancelled = false;
    const esc = ev => { if (ev.key === 'Escape') cancelled = true; }; document.addEventListener('keydown', esc);
    const draw = () => { el.innerHTML = '<span>' + n + '</span><small>Esc to cancel</small>'; };
    draw();
    const t = setInterval(() => {
      if (cancelled) { clearInterval(t); el.classList.remove('show'); document.removeEventListener('keydown', esc); rej(Object.assign(new Error('cancelled'), { name: 'AbortError' })); return; }
      if (--n <= 0) { clearInterval(t); el.classList.remove('show'); document.removeEventListener('keydown', esc); res(); } else draw();
    }, 1000);
  });
}


/* ───────────── One-click UI ───────────── */
const flags = { mic: true, cam: false, sys: false };
let busy = false, recording = false, tick = null, url = null;
const app = $('app');

function say(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(() => el.classList.remove('show'), 4500); }
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  if (busy || recording) return;
  const k = c.dataset.k; flags[k] = !flags[k];
  c.classList.toggle('on', flags[k]); c.setAttribute('aria-pressed', flags[k]);
}));
function lock(on) { document.querySelectorAll('.chip').forEach(c => (c.disabled = on)); }

async function start() {
  if (busy || recording) return;
  busy = true; lock(true); $('timer').textContent = 'Choose what to share…';
  try {
    await core.open({ mode: flags.cam ? 'both' : 'screen', mic: flags.mic, sysAudio: flags.sys });
    if (core.micFailed) say('Microphone unavailable — recording without voice.');
    await countdown(3, $('cd'));
    core.onEnded = () => stop();
    core.record({ bitrate: 5e6 });
    recording = true; busy = false;
    app.classList.add('recording'); $('rec').setAttribute('aria-label', 'Stop recording');
    tick = setInterval(() => { $('timer').textContent = fmt(core.elapsed()); }, 250);
  } catch (e) {
    core.close(); busy = false; lock(false);
    $('timer').textContent = 'Ready when you are';
    if (e.name !== 'AbortError') say(nice(e));
  }
}
async function stop() {
  if (!recording) return;
  recording = false; clearInterval(tick); app.classList.remove('recording');
  $('rec').setAttribute('aria-label', 'Start recording'); lock(false);
  const { blob, seconds } = await core.stop();
  if (!blob.size) { say('Nothing was recorded.'); $('timer').textContent = 'Ready when you are'; return; }
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(blob);
  $('player').src = url;
  $('dl').href = url; $('dl').download = 'recording ' + stamp() + '.webm';
  $('meta').textContent = fmt(seconds) + ' · ' + mb(blob.size) + ' · WebM';
  $('home').hidden = true; $('done').hidden = false;
}
$('rec').addEventListener('click', () => (recording ? stop() : start()));
$('again').addEventListener('click', () => {
  $('player').removeAttribute('src'); $('done').hidden = true; $('home').hidden = false; $('timer').textContent = 'Ready when you are';
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && recording) { e.preventDefault(); stop(); }
});
</script>
</body>
</html>
